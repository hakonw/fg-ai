[project]
name = "samfundet-backend"
version = "0.1.0"
description = "Backend for the Samfundet image search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "robyn",
    "insightface>=0.7.3",
    "numpy>=2.4.0",
    "opencv-python>=4.11.0.86",
    "onnxruntime",
    "python-dotenv>=1.0.1",
    "qdrant-client>=1.16.2",
    "supabase>=2.27.0",
]

[tool.uv]
package = false
