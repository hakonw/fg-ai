[project]
name = "samfundet-backend"
version = "0.1.0"
description = "Backend for the Samfundet image search"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "robyn>=0.83.0",
    "insightface>=2.1",
    "numpy>=2.4.0",
    "opencv-python-headless",
    "onnxruntime",
    "python-dotenv>=1.0.1",
    "qdrant-client>=1.16.2",
    "supabase>=2.27.0",
]

[tool.uv]
package = false
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]